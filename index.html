<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shipment Hub Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.9/signalr.min.js"></script>
</head>
<body>
    <h1>Shipment Hub Test</h1>
    <ul id="shipment-list"></ul>

    <script>
        // Connect to your SignalR hub (full URL to match server)
        const connection = new signalR.HubConnectionBuilder()
            .withUrl("http://localhost:5246/hubs/shipments") // make sure this matches your API
            .configureLogging(signalR.LogLevel.Information)
            .build();

        // Handler for ShipmentCreated event
        connection.on("ShipmentCreated", shipment => {
            const li = document.createElement("li");
            li.textContent = `PO: ${shipment.purchaseOrderNumber}, Vendor: ${shipment.vendor}, Time: ${shipment.timeOfArrival}, Created By: ${shipment.createdBy}`;
            document.getElementById("shipment-list").appendChild(li);
        });

        // Start the connection
        connection.start()
            .then(() => console.log("Connected to Shipment Hub"))
            .catch(err => console.error("Connection failed:", err));
    </script>
</body>
</html>
